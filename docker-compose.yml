services:
  # PHP-FPM application (RNF-OPS-001). Built from ./Dockerfile (prod stage).
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: crm-maia-app
    env_file:
      - .env.docker
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # nginx web server. Public files + FPM proxy.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # MySQL 8.0 (utf8mb4 / utf8mb4_unicode_ci, ADR-013).
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm_maia}
      MYSQL_USER: ${MYSQL_USER:-crm_maia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Queue worker (RNF-OPS-002 ready: Excel/PDF jobs in later blocks).
  queue:
    image: crm-maia-app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env.docker
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      - app
    restart: unless-stopped

  # Scheduler (activities:mark-overdue daily 02:00 America/Lima, RF-ACT-003).
  scheduler:
    image: crm-maia-app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    command: php artisan schedule:work
    env_file:
      - .env.docker
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
  storage-data:
