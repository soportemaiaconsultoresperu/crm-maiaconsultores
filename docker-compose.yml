x-app-env: &app-env
  env_file:
    # The committed defaults make `docker compose config` reproducible. A local
    # .env.docker, when present, overrides them and is never committed.
    - path: docker/env.docker.example
      required: true
    - path: .env.docker
      required: false

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    <<: *app-env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Runs exactly once per deployment. It prepares a new database before any
  # long-running Laravel process is allowed to start.
  init:
    image: crm-maia-app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    <<: *app-env
    volumes:
      - storage-data:/var/www/html/storage/app
    command: sh -c 'php artisan migrate --force && php artisan db:seed --force'
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    image: crm-maia-app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    <<: *app-env
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
    image: crm-maia-caddy
    environment:
      # Require the variable to be defined while allowing the committed empty
      # placeholder to support configuration-only validation.
      CADDY_EMAIL: ${CADDY_EMAIL?CADDY_EMAIL must be defined}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage-data:/srv/storage/app:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  queue:
    image: crm-maia-app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    <<: *app-env
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: crm-maia-app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    <<: *app-env
    command: php artisan schedule:work
    volumes:
      - storage-data:/var/www/html/storage/app
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
  storage-data:
  caddy-data:
  caddy-config:
